[project]
name = "covale"
version = "0.1.0"
description = "Neuroimaging workflows with nibabel and the OpenAI API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.19",
    "langchain-openai>=1.6.6",
    "nibabel>=5.4.2",
    "openai>=3.20.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
covale = "covale:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
